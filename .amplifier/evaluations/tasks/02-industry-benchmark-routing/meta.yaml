name: 02-industry-benchmark-routing
description: >
  Does the /evaluation mode correctly route a broad model-swap validation
  question ("how do I validate changing the default model?") to the
  amplifier-benchmark suite (starting with ~5 tasks) rather than suggesting
  custom one-off tasks?
difficulty: easy
categories:
  - meta-eval
  - bundle-evaluation
