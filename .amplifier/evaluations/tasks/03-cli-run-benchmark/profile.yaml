# DTU profile for the "does /evaluation drive the amplifier-evaluation CLI to
# run the BUILT-IN benchmark?" meta-eval.
#
# This is a DTU *host* profile: it installs Incus (inner container runtime) and
# Docker so the agent under test can LAUNCH nested DTUs. Here the nested DTUs are
# spawned by the amplifier-evaluation harness itself (one per benchmark task,
# run in parallel). The Incus/Docker host stack is the same one used by
# 01-evaluate-amplifier-bundle.
#
# On top of that infra this profile installs the amplifier-evaluation CLI *from a
# built wheel* so the run genuinely exercises the SHIPPED package:
#   - clones amplifier-bundle-evaluation (redirected to the Gitea mirror whose
#     `main` is the deployed working-tree snapshot),
#   - `uv build --wheel` -- the wheel force-includes the amplifier-benchmark
#     suite at amplifier_evaluation/benchmark/ (see pyproject.toml),
#   - `uv tool install <wheel> --with amplifier-foundation@git` -- amplifier-core
#     resolves from PyPI, amplifier-foundation from GitHub.
# The installed CLI therefore ships the built-in tasks; the agent runs them with
# NO --tasks-dir, proving the suite travels with the package.
#
# url_rewrites redirects amplifier-bundle-evaluation clones to the local Gitea
# mirror. GITEA_URL + GITEA_TOKEN are threaded by the wrapper via --launch-var.

name: eval03-cli-run-benchmark
description: >
  Ubuntu 24.04 DTU host with Incus + Docker + uv + tmux, plus the
  amplifier-evaluation CLI installed from a built wheel (built-in benchmark
  suite shipped inside it). Lets the agent under test drive the CLI to launch
  nested benchmark DTUs in parallel and emit results. Redirects
  amplifier-bundle-evaluation clones to a local Gitea mirror.

base:
  image: ubuntu:24.04

url_rewrites:
  auth:
    username: admin
    token_var: GITEA_TOKEN
  rules:
    - match: github.com/microsoft/amplifier-bundle-evaluation
      target: ${GITEA_URL}/admin/amplifier-bundle-evaluation

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY
    - name: openai
      key_env: OPENAI_API_KEY

provision:
  setup_cmds:
    # --- Common prereqs (+ tmux for the AIUser's persistent TUI driving) ---
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      timeout 180 apt-get update
      timeout 300 apt-get install -y ca-certificates curl gnupg git tmux

    # --- Incus via Zabbly stable repo (noble = Ubuntu 24.04) ----------
    - |
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      timeout 30 curl -fsSL --max-time 20 \
        https://pkgs.zabbly.com/key.asc \
        -o /etc/apt/keyrings/zabbly.asc
      chmod a+r /etc/apt/keyrings/zabbly.asc
      ARCH=$(dpkg --print-architecture)
      cat > /etc/apt/sources.list.d/zabbly-incus-stable.sources <<EOF
      Enabled: yes
      Types: deb
      URIs: https://pkgs.zabbly.com/incus/stable
      Suites: noble
      Components: main
      Architectures: ${ARCH}
      Signed-By: /etc/apt/keyrings/zabbly.asc
      EOF

    # --- Docker CE apt repo -------------------------------------------
    - |
      set -euo pipefail
      timeout 30 curl -fsSL --max-time 20 \
        https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      ARCH=$(dpkg --print-architecture)
      CODENAME=$(. /etc/os-release && echo "${VERSION_CODENAME}")
      echo "deb [arch=${ARCH} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list

    # --- Install both stacks in a single apt transaction --------------
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      timeout 180 apt-get update
      timeout 600 apt-get install -y \
        incus incus-base incus-client \
        docker-ce docker-ce-cli containerd.io

    # --- Ensure both daemons are up via systemd -----------------------
    - |
      set -euo pipefail
      if command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]; then
        timeout 30 systemctl enable --now incus.socket incus.service
        timeout 30 systemctl enable --now docker.service
      else
        nohup incusd  >/var/log/incusd.log  2>&1 &
        nohup dockerd >/var/log/dockerd.log 2>&1 &
      fi
      for i in $(seq 1 60); do
        [ -S /var/lib/incus/unix.socket ] && [ -S /var/run/docker.sock ] && break
        sleep 1
      done
      if [ ! -S /var/lib/incus/unix.socket ]; then
        echo "ERROR: Incus socket missing at /var/lib/incus/unix.socket"
        (journalctl -u incus --no-pager -n 100 2>/dev/null) || true
        exit 1
      fi
      if [ ! -S /var/run/docker.sock ]; then
        echo "ERROR: Docker socket missing at /var/run/docker.sock"
        (journalctl -u docker --no-pager -n 100 2>/dev/null) || true
        exit 1
      fi
      echo "Both sockets up after ${i}s"

    # --- Inner Incus: minimal init + privileged default profile -------
    - timeout 60 incus admin init --minimal
    - timeout 15 incus profile set default security.privileged=true

    # --- Install uv (adds ~/.local/bin to ~/.profile) -----------------
    - |
      set -euo pipefail
      timeout 60 curl -LsSf --max-time 45 https://astral.sh/uv/install.sh | sh

    - mkdir -p /workspace

    # --- Install the amplifier-evaluation CLI from a built wheel --------
    # Build the wheel from the (mirror-redirected) bundle clone so the
    # force-included amplifier-benchmark suite ships inside it, then install it
    # as a tool. amplifier-core comes from PyPI; amplifier-foundation from git.
    - |
      set -euo pipefail
      export PATH=/root/.local/bin:$PATH
      cd /workspace
      timeout 300 git clone --depth 1 https://github.com/microsoft/amplifier-bundle-evaluation.git
      cd /workspace/amplifier-bundle-evaluation
      timeout 600 uv build --wheel -o /workspace/whl
      timeout 900 uv tool install /workspace/whl/*.whl \
        --with "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main"

    - mkdir -p /workspace/eval-output

readiness:
  - name: incus-daemon
    command: "incus info >/dev/null 2>&1"
  - name: default-profile-privileged
    command: "incus profile show default | grep -q 'security.privileged: \"true\"'"
  - name: docker-daemon
    command: "docker info >/dev/null 2>&1"
  - name: uv-installed
    command: "PATH=/root/.local/bin:$PATH uv --version"
  - name: amplifier-evaluation-ships-builtin-tasks
    command: "PATH=/root/.local/bin:$PATH amplifier-evaluation run --agent amplifier-foundation --task arxiv_conclusion_extraction --task cpsc_recall_monitor --dry-run 2>&1 | grep -q 'Will run 2 pair'"
  - name: workspace-exists
    command: "test -d /workspace && echo OK"
