[project]
name = "amplifier-module-hooks-crusty-reminder"
version = "0.1.0"
description = "Hook that reminds the agent to consult the crusty-old-engineer skill after implementation work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-crusty-reminder = "amplifier_module_hooks_crusty_reminder:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_crusty_reminder"]
