# Eval example 01: AFTER (foundation@remove-explorer, foundation:explorer agent removed)
#
# Launch with:
#   amplifier-digital-twin launch profiles/after.yaml \
#     --var GITEA_URL=http://localhost:10110 \
#     --var GITEA_TOKEN=<token> \
#     --name eval01-after
#
# Pre-launch requirements:
#   - amplifier-foundation mirrored to Gitea with branch `remove-explorer` pushed
#   - ANTHROPIC_API_KEY set in the host environment

name: eval01-explorer-removal-after
description: >
  AFTER arm of example 01. Foundation installed from remove-explorer
  branch (foundation:explorer agent and references stripped). Used to
  measure the agent's contribution by absence.

base:
  image: ubuntu:24.04

url_rewrites:
  auth:
    username: admin
    token_var: GITEA_TOKEN
  rules:
    - match: github.com/microsoft/amplifier-foundation
      target: ${GITEA_URL}/admin/amplifier-foundation
    - match: github.com/microsoft/amplifier-bundle-context-intelligence
      target: ${GITEA_URL}/admin/amplifier-bundle-context-intelligence

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY

provision:
  setup_cmds:
    - apt-get update && apt-get install -y git curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh

    - |
      export PATH="/root/.local/bin:$PATH"
      uv tool install git+https://github.com/microsoft/amplifier

    # Unquoted heredoc so ANTHROPIC_API_KEY (from passthrough.services) is
    # expanded into the file at provision time.
    - |
      mkdir -p /root/.amplifier
      cat > /root/.amplifier/settings.yaml <<EOF
      config:
        providers:
          - module: provider-anthropic
            source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
            config:
              api_key: ${ANTHROPIC_API_KEY}
      EOF

    # Add foundation bundle from remove-explorer branch (rewritten to Gitea).
    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier bundle add git+https://github.com/microsoft/amplifier-foundation@remove-explorer --app

    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier bundle add git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main

    - mkdir -p /work && git clone --depth 1 https://github.com/microsoft/agent-framework /work/agent-framework

    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier --version
      amplifier bundle list

readiness:
  - name: amplifier-installed
    command: 'PATH=/root/.local/bin:$PATH amplifier --version'
  - name: agent-framework-cloned
    command: 'test -d /work/agent-framework/.git && echo OK'
