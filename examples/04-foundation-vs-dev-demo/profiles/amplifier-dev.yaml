# Eval example 04, variant "amplifier-dev":
# amplifier CLI + amplifier-dev bundle (which composes foundation +
# amplifier-dev behavior + amplifier-tester + bundle-design context).
#
# Used as the comparison variant against the plain "foundation" profile.
#
# Launch:
#   amplifier-digital-twin launch profiles/amplifier-dev.yaml --name demo04-amplifier-dev-<bench>-<idx>
#
# Pre-launch requirements:
#   - ANTHROPIC_API_KEY set in host env

name: eval04-amplifier-dev
description: >
  amplifier + amplifier-dev bundle (foundation + amplifier-dev behavior +
  amplifier-tester + bundle-design context). Bench task data is pushed
  into /work/task/ at runtime.

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY

provision:
  setup_cmds:
    - apt-get update && apt-get install -y git curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh

    - |
      export PATH="/root/.local/bin:$PATH"
      uv tool install git+https://github.com/microsoft/amplifier

    # Pin Opus 4.7 as default across the board (mirrors host ~/.amplifier/settings.yaml).
    # routing.matrix=opus47 makes all model_role mappings route to claude-opus-4-7.
    - |
      mkdir -p /root/.amplifier
      cat > /root/.amplifier/settings.yaml <<EOF
      config:
        providers:
          - module: provider-anthropic
            source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
            config:
              api_key: ${ANTHROPIC_API_KEY}
              default_model: claude-opus-4-7
              enable_1m_context: 'true'
              enable_prompt_caching: 'true'
              priority: 1
      routing:
        matrix: opus47
      EOF

    # amplifier-dev bundle YAML lives inside the amplifier-foundation repo.
    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier bundle add 'git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=bundles/amplifier-dev.yaml' --app

    - mkdir -p /work/task

    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier --version
      amplifier bundle list

readiness:
  - name: amplifier-installed
    command: 'PATH=/root/.local/bin:$PATH amplifier --version'
  - name: workdir-exists
    command: 'test -d /work/task && echo OK'
  - name: git-available
    command: 'git --version'