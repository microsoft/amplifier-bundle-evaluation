[project]
name = "amplifier-bundle-evaluation"
version = "0.2.0"
description = "One-stop-shop for evaluations across the Amplifier ecosystem: tasks, agents, AI User, grader, extractor, orchestrator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Microsoft MADE:Explorations Team" }]
keywords = ["amplifier", "evaluation", "agents", "benchmarks", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "amplifier-core",
    "amplifier-foundation",
    "click>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
amplifier-evaluation = "amplifier_evaluation.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
]

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }
amplifier-foundation = { git = "https://github.com/microsoft/amplifier-foundation", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_evaluation"]

# Ship the built-in benchmark suite (agents + tasks) inside the wheel so the
# amplifier-evaluation CLI/library can run it out of the box, with no checkout.
# The repo-root `amplifier-benchmark/` is copied to `amplifier_evaluation/benchmark/`
# in the installed package; `harness/resources.py` resolves it at runtime.
[tool.hatch.build.targets.wheel.force-include]
"amplifier-benchmark" = "amplifier_evaluation/benchmark"
