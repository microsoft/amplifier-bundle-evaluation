# Paths inside the DTU containing agent artifacts to extract after a run.
#
# {session_id} is substituted at extraction time with the value captured
# from stdout per invocation.yaml.
#
# Amplifier sessions are partitioned by a slug of the working directory:
# /workspace -> -workspace. Since invocation.working_dir is /workspace,
# the slug is fixed at "-workspace".

session_data:
  base_path: /root/.amplifier/projects/-workspace/sessions/{session_id}
  files:
    - transcript.jsonl   # user + assistant turns
    - metadata.json      # session_id, model, turn_count, timestamps
    - events.jsonl       # kernel-level events

workspace:
  path: /workspace
