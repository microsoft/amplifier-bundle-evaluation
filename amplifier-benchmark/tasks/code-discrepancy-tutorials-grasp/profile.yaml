name: eval-task-code-discrepancy-tutorials-grasp
description: Evaluation task environment for code-discrepancy-tutorials-grasp. Ubuntu 24.04 with uv, outbound internet, and Anthropic/OpenAI key passthrough.
base:
  image: ubuntu:24.04
passthrough:
  allow_external: true
  services:
  - name: anthropic
    key_env: ANTHROPIC_API_KEY
  - name: openai
    key_env: OPENAI_API_KEY
provision:
  setup_cmds:
  - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - mkdir -p /workspace
  - apt-get update && apt-get install -y unzip && rm -rf /var/lib/apt/lists/*
readiness:
- name: uv-installed
  command: uv --version
